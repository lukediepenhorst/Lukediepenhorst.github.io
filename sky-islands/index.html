<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>Sky Islands</title>
  <meta name="description" content="Fly a small glider between floating islands and collect crystals. A fictional game by Luke Diepenhorst.">
  <link rel="stylesheet" href="sky.css">
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="view"></div>
  <div id="hud">
    <p id="score">Crystals 0 / 8</p>
    <p id="time">0:00</p>
  </div>
  <div id="title" class="panel">
    <h1>Sky Islands</h1>
    <p>Fly between the islands. Collect every crystal and slip through the rings.</p>
    <button type="button" id="play">Play</button>
    <p class="controls-note" id="controls-note"></p>
  </div>
  <div id="end" class="panel" hidden>
    <h2 id="end-title">All crystals</h2>
    <p id="end-copy"></p>
    <button type="button" id="replay">Fly again</button>
  </div>
  <button type="button" id="mute" aria-pressed="true">Sound off</button>
  <div id="stick" hidden><div id="knob"></div></div>
  <button type="button" id="boost" hidden>Boost</button>
  <footer>Built by Luke Diepenhorst</footer>
  <script type="module" src="sky.js"></script>
</body>
</html>
